<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Agenda tu cita de reparación y mantenimiento vehicular con AutoFix a domicilio.">
    <title>AutoFix - Agendar Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../../index.html">
                AutoFix
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="../../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios_precios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="citas.html">Agendar Cita</a></li>
                    <li class="nav-item"><a class="nav-link" href="pago2.0.html">Pagar en Línea</a></li>
                </ul>
            </div>
        </div>
    </nav>
    </header>
    <main class="flex-grow-1 d-flex flex-column justify-content-center" style="padding-bottom: 2rem;">
    <form class="d-flex flex-column align-items-center justify-content-center" style="max-width: 400px; margin: 0 auto 2rem auto;">
        <div class="mb-3 w-100">
            <label class="form-label fw-bold display-5 text-dark text-center w-100" style="letter-spacing:1px;">Solicitar Reparación</label>
        </div>
        <div class="mb-3 w-100">
            <label class="form-label" for="nombre">Nombre del cliente</label>
            <input type="text" class="form-control" id="nombre" required>
        </div>
        <div class="mb-3 w-100">
            <label class="form-label" for="tipo">Tipo de reparación</label>
            <select class="form-select" id="tipo" required>
                <option value="" disabled selected>Selecciona un servicio</option>
                <option value="cambio_aceite">Cambio de Aceite</option>
                <option value="revision_frenos">Revisión de Frenos</option>
                <option value="diagnostico_electrico">Diagnóstico Eléctrico</option>
                <option value="otro">Otro (Describir abajo)</option>
            </select>
        </div>
        <div class="mb-3 w-100">
            <label class="form-label" for="descripcion">Descripción</label>
            <textarea class="form-control form-control-lg" id="descripcion" rows="3" required></textarea>
        </div>
        <div class="mb-3 w-100">
            <label class="form-label" for="fecha">Agendar Cita</label>
            <input type="date" class="form-control" id="fecha" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Enviar</button>
    </form>
    </main>
    <footer class="site-footer bg-dark text-white text-center py-4 mt-auto" style="margin-top:auto;">
        <div class="container">
            <p class="mb-1">&copy; 2025 AutoFix. Todos los derechos reservados.</p>
            <p class="mb-0">Proyecto desarrollado por: <span class="fw-bold">Leonardo, Eduardo, Paulina R., Paulina H., Carlos, Jasmin.</span></p>
        </div>
    </footer>
</body>

</html>
